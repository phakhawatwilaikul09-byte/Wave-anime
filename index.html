<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wave Survival</title>
<style>
  :root{--bg:#05060d;--cyan:#27f0ff;--magenta:#ff2e93;--violet:#7a5cff;--text:#d9e6ff;--hp:#ff3860}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,sans-serif}
  canvas{display:block;touch-action:none}
  body{touch-action:none;-webkit-user-select:none;user-select:none}
  #hud{position:fixed;inset:0;pointer-events:none;display:none}
  /* ===== Hotbar 5 ช่อง: ช่องล่องหน โปร่งใส ===== */
  #hotbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto;z-index:3}
  #hotbar .slot{position:relative;width:48px;height:48px;box-sizing:border-box;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.18);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .12s,background .12s}
  #hotbar .slot.sel{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.1)}
  #hotbar .slot .cnt{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000}
  body.touch #hotbar{bottom:8px;gap:6px}
  body.touch #hotbar .slot{width:44px;height:44px;font-size:21px}
  #hotbar .slot .kh{position:absolute;left:4px;top:1px;font-size:10px;font-weight:800;opacity:.6;text-shadow:0 1px 2px #000}
  .stat{position:absolute;top:16px;font-size:20px;font-weight:700;letter-spacing:.04em;text-shadow:0 0 10px var(--cyan)}
  #score{right:20px;top:142px;font-size:16px}#gold{right:20px;top:164px;font-size:16px;color:#ffd86a;text-shadow:0 0 8px #b8860b}#wave{right:20px;top:114px;text-shadow:0 0 10px var(--magenta)}
  #cross{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#ff2a2a}
  #chg{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;opacity:0;transition:opacity .12s;--p:0%;--c:#b36bff;
    background:conic-gradient(var(--c) var(--p), rgba(255,255,255,.12) 0);-webkit-mask:radial-gradient(circle,transparent 25px,#000 26px);mask:radial-gradient(circle,transparent 25px,#000 26px);filter:drop-shadow(0 0 8px var(--c))}
  #chgtxt{position:absolute;left:50%;top:50%;margin:40px 0 0 -40px;width:80px;text-align:center;font-size:14px;font-weight:800;letter-spacing:.08em;opacity:0;color:var(--c,#fff);text-shadow:0 0 10px currentColor}
  #banner{position:absolute;left:0;right:0;top:28%;text-align:center;font-size:clamp(28px,6vw,64px);font-weight:800;color:#fff;
    text-shadow:0 0 18px var(--magenta),0 0 40px var(--violet);opacity:0;transition:opacity .4s}
  #flash{position:absolute;inset:0;background:radial-gradient(transparent 45%,rgba(255,40,80,.55));opacity:0;transition:opacity .25s}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:rgba(3,4,12,.82);text-align:center;padding:24px;z-index:5}
  .screen h1{font-size:clamp(34px,7vw,72px);color:#fff;text-shadow:0 0 22px var(--cyan),0 0 44px var(--violet)}
  .screen p{max-width:520px;line-height:1.6;opacity:.9}
  button{pointer-events:auto;cursor:pointer;font:700 20px inherit;font-family:inherit;color:#05060d;background:var(--cyan);border:0;border-radius:10px;
    padding:14px 34px;box-shadow:0 0 22px rgba(39,240,255,.7)}
  button:hover{background:#fff}
  button:focus-visible{outline:3px solid var(--magenta);outline-offset:3px}
  #joy{position:fixed;left:24px;bottom:70px;width:130px;height:130px;border-radius:50%;border:2px solid rgba(39,240,255,.5);background:rgba(39,240,255,.08);display:none;z-index:3}
  #knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(39,240,255,.55);box-shadow:0 0 14px var(--cyan)}
  #fire{position:fixed;right:24px;bottom:70px;width:100px;height:100px;border-radius:50%;border:2px solid var(--magenta);background:rgba(255,46,147,.25);color:#fff;font-size:16px;font-weight:800;display:none;z-index:3;box-shadow:0 0 18px rgba(255,46,147,.6)}
  body.touch #joy,body.touch #fire{display:block}
  #panel{position:absolute;left:12px;top:10px;display:flex;align-items:center}
  #face{position:relative;z-index:2;flex:none;width:84px;height:84px;border-radius:50%;border:3px solid #d9b24a;overflow:hidden;background:#0c0a18;
    box-shadow:0 0 14px rgba(217,178,74,.6),inset 0 0 10px #000;transition:border-color .15s,box-shadow .15s}
  #face canvas{width:100%;height:100%;display:block}
  #face.hurt{border-color:#ff3860;box-shadow:0 0 20px rgba(255,56,96,.9),inset 0 0 14px rgba(255,56,96,.6)}
  #face.low{border-color:#ff5a6e}
  #bars{margin-left:-16px;padding:3px 10px 5px 24px;background:linear-gradient(90deg,rgba(5,6,13,.15),rgba(5,6,13,.5));border-radius:0 12px 12px 0}
  #pname{font-size:13px;font-weight:800;letter-spacing:.1em;text-shadow:0 0 8px var(--cyan)}
  .bar{position:relative;height:16px;margin-top:4px;width:min(190px,30vw);border:2px solid var(--cyan);border-radius:4px 10px 10px 4px;background:rgba(0,0,0,.6);overflow:hidden}
  .bar>div{height:100%}
  .bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000}
  #hpbar{border-color:#ff5a6e;box-shadow:0 0 10px rgba(255,56,96,.45)}
  #hpfill{width:100%;background:linear-gradient(90deg,var(--hp),#ff8a5c);transition:width .15s}
  #mpbar{border-color:#4aa8ff;box-shadow:0 0 10px rgba(74,168,255,.45)}
  #mpfill{width:100%;background:linear-gradient(90deg,#2a6cff,#4be0ff)}
  #mpbar.empty{border-color:#ff3860;box-shadow:0 0 12px rgba(255,56,96,.8)}
  #shopbtn{position:fixed;top:60px;right:12px;z-index:8;width:42px;height:42px;padding:0;border-radius:50%;font-size:18px;line-height:1;display:none;
    background:rgba(10,6,30,.55);color:#fff;border:1px solid rgba(255,216,106,.8);box-shadow:0 0 12px rgba(255,216,106,.5)}
  #shopbtn:hover{background:rgba(110,80,20,.85)}
  #shop{display:none;position:fixed;inset:0;z-index:7;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:70px 20px 24px;overflow:auto;background:rgba(3,4,12,.92);text-align:center}
  #shop h2{font-size:clamp(26px,5vw,44px);color:#fff;text-shadow:0 0 18px #ffd86a}
  #shopgold{font-size:20px;font-weight:800;color:#ffd86a;text-shadow:0 0 8px #b8860b}
  #shopitems{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
  .item{width:min(250px,80vw);padding:16px;border:2px solid var(--violet);border-radius:14px;background:rgba(20,14,50,.85);box-shadow:0 0 16px rgba(122,92,255,.4)}
  .item.soon{opacity:.45;border-style:dashed}
  .item .ic{font-size:42px;line-height:1.2}.item .nm{font-size:18px;font-weight:800;margin:4px 0}.item .ds{font-size:13px;line-height:1.5;opacity:.85;min-height:84px}
  .item button{margin-top:10px;font-size:15px;padding:10px 18px;width:100%}
  .item button:disabled{opacity:.45;cursor:default;box-shadow:none;background:#6b7a99}
  .skbtn{position:fixed;right:112px;bottom:28px;width:72px;height:72px;padding:0;border-radius:50%;border:2px solid #b36bff;--p:100%;display:none;z-index:3;
    background:conic-gradient(rgba(179,107,255,.6) var(--p), rgba(5,6,13,.65) 0);color:#fff;font-size:26px;line-height:1.05;box-shadow:0 0 16px rgba(179,107,255,.6)}
  .skbtn small{display:block;font-size:10px;font-weight:700;opacity:.8}
  .skbtn.cool{box-shadow:none;border-color:rgba(179,107,255,.45)}
  body.touch .skbtn{right:124px;bottom:186px;width:78px;height:78px}
  body.touch .skbtn small{display:none}
  #sk2{right:196px;border-color:#5dffa0;background:conic-gradient(rgba(93,255,160,.55) var(--p), rgba(5,6,13,.65) 0);box-shadow:0 0 16px rgba(93,255,160,.6)}
  #sk2.cool{box-shadow:none;border-color:rgba(93,255,160,.45)}
  body.touch #sk2{right:214px;bottom:186px;width:78px;height:78px}
  #sk3{right:280px;border-color:#4be0ff;background:conic-gradient(rgba(75,224,255,.55) var(--p), rgba(5,6,13,.65) 0);box-shadow:0 0 16px rgba(75,224,255,.6)}
  #sk3.cool{box-shadow:none;border-color:rgba(75,224,255,.45)}
  body.touch #sk3{right:304px;bottom:186px;width:78px;height:78px}
  #dash{position:fixed;right:28px;bottom:28px;width:72px;height:72px;padding:0;border-radius:50%;border:2px solid var(--cyan);--p:100%;
    background:conic-gradient(rgba(39,240,255,.55) var(--p), rgba(5,6,13,.65) 0);color:#fff;font-size:15px;font-weight:800;line-height:1.1;display:block;z-index:3;
    box-shadow:0 0 16px rgba(39,240,255,.55);transition:box-shadow .15s}
  #dash small{display:block;font-size:10px;font-weight:600;opacity:.75}
  #dash.cool{box-shadow:none;border-color:rgba(39,240,255,.45)}
  body.touch #dash{right:34px;bottom:186px;width:78px;height:78px}
  body.touch #dash small{display:none}
  #start{display:block;padding:0;background:#05060d}#titleCv{width:100%;height:100%;display:block}
  #mute{position:fixed;top:12px;right:12px;z-index:8;width:42px;height:42px;padding:0;border-radius:50%;font-size:18px;line-height:1;background:rgba(10,6,30,.55);color:#fff;border:1px solid rgba(179,107,255,.7);box-shadow:0 0 12px rgba(179,107,255,.6)}
  #mute:hover{background:rgba(60,30,110,.85)}
  /* ===== ปุ่มสกิล/แดชแบบเล็กกะทัดรัด เรียงชิดมุมขวาล่าง ไม่บังกลางจอ ===== */
  #dash,.skbtn{width:56px;height:56px;border-width:2px;opacity:.85;font-size:12px;transition:opacity .15s,box-shadow .15s,transform .1s}
  .skbtn{font-size:22px}
  #dash:active,.skbtn:active{transform:scale(.92)}
  #dash.cool,.skbtn.cool{opacity:.55}
  #dash small,.skbtn small{position:absolute;right:-2px;bottom:-2px;min-width:16px;padding:1px 4px;border-radius:8px;background:rgba(5,6,13,.85);border:1px solid rgba(255,255,255,.35);font-size:10px;line-height:1.2;opacity:1}
  #dash,#sk1,#sk2,#sk3{bottom:18px}
  #dash{right:18px}#sk1{right:84px}#sk2{right:150px}#sk3{right:216px}
  /* มือถือ: เรียงเป็นโค้งรอบปุ่มยิง (วงรัศมี ~100px) — บนสุด = แดช ลงมาเป็นสกิล 1 · 2 · 3  ปุ่มเล็ก 42px เว้นระยะห่างกัน */
  body.touch #dash,body.touch #sk1,body.touch #sk2,body.touch #sk3{width:42px;height:42px;font-size:12px}
  body.touch .skbtn span{font-size:17px;line-height:1}
  body.touch #dash small,body.touch .skbtn small{display:none}
  body.touch #dash{right:53px;bottom:199px}
  body.touch #sk1{right:115px;bottom:178px}
  body.touch #sk2{right:150px;bottom:123px}
  body.touch #sk3{right:144px;bottom:58px}
  #bossbar{position:absolute;left:12px;top:98px;width:min(190px,40vw);display:none;text-align:left}
  #bossname{font-size:11px;font-weight:800;letter-spacing:.1em;color:#ff8a9a;text-shadow:0 0 8px #ff2040}
  #bossbar .bar{width:100%;height:10px;margin-top:2px;border-color:#b36bff;box-shadow:0 0 12px rgba(179,107,255,.6)}
  #bossfill{width:100%;background:linear-gradient(90deg,#ff2040,#ff8a5c);transition:width .1s}
  #over{display:none}#over h1{color:var(--hp);text-shadow:0 0 22px var(--hp)}
</style>
</head>
<body>
<button id="shopbtn" title="ร้านค้า (B)" aria-label="ร้านค้า">🛒</button>
<button id="mute" title="เปิด/ปิดเสียง (M)" aria-label="เปิด/ปิดเสียง">🔊</button>
<div id="hud">
  <div id="score" class="stat">Score 0</div>
  <div id="gold" class="stat">Gold 0</div>
  <div id="wave" class="stat">Wave 1</div>
  <div id="cross"></div><div id="chg"></div><div id="chgtxt"></div>
  <div id="banner"></div>
  <div id="hotbar"><div class="slot sel" data-i="0"></div><div class="slot" data-i="1"></div><div class="slot" data-i="2"></div><div class="slot" data-i="3"></div><div class="slot" data-i="4"></div></div>
  <div id="flash"></div>
  <div id="bossbar"><div id="bossname">👹 BOSS</div><div class="bar"><div id="bossfill"></div></div></div>
  <div id="panel">
    <div id="face"><canvas id="facecv" width="168" height="168"></canvas></div>
    <div id="bars">
      <div id="pname">WIZARD</div>
      <div class="bar" id="hpbar"><div id="hpfill"></div><span id="hptxt">HP 100 / 100</span></div>
      <div class="bar" id="mpbar"><div id="mpfill"></div><span id="mptxt">MP 100 / 100</span></div>
    </div>
  </div>
</div>

<div id="joy"><div id="knob"></div></div>
<button id="fire">ยิง</button>
<button id="sk1" class="skbtn" title="สกิล 1 (กด 1)"><span id="sk1txt">🔮</span><small>1</small></button>
<button id="sk2" class="skbtn" title="สกิล 2 (กด 2)"><span id="sk2txt">🌿</span><small>2</small></button>
<button id="sk3" class="skbtn" title="สกิล 3 (กด 3)"><span id="sk3txt">🛡️</span><small>3</small></button>
<button id="dash"><span id="dashtxt">แดช</span><small>Space</small></button>

<div id="shop"><h2>🛒 ร้านค้า</h2><div id="shopgold">Gold 0</div><div id="shopitems"></div><button id="shopclose">ปิด (B)</button></div>

<div id="start" class="screen"><canvas id="titleCv" aria-label="Wave Survival – Start Game"></canvas></div>
<div id="over" class="screen">
  <h1>GAME OVER</h1>
  <p id="finalTxt"></p>
  <button id="restartBtn">Restart</button>
</div>

<script>
/* ===== เสียงทั้งหมดสังเคราะห์ด้วย Web Audio API (ไม่ใช้ไฟล์เสียง) ===== */
window.SFX = (() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  let ac, master, sfx, mus, echo, nbuf, muted = false, musicOn = false, timer = null, nextT = 0, step = 0, amb = null, intensity = 0, lastSpawn = 0;
  const R = (a,b) => a + Math.random()*(b-a);
  const btn = document.getElementById('mute');
  function init(){
    if (!AC) return false;
    if (!ac){
      ac = new AC();
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6;
      master = ac.createGain(); master.gain.value = muted ? 0 : .8; master.connect(comp); comp.connect(ac.destination);
      sfx = ac.createGain(); sfx.connect(master);
      mus = ac.createGain(); mus.gain.value = .55; mus.connect(master);
      echo = ac.createDelay(1); echo.delayTime.value = .45;
      const fb = ac.createGain(); fb.gain.value = .4; const ef = ac.createBiquadFilter(); ef.type = 'lowpass'; ef.frequency.value = 1800;
      echo.connect(ef); ef.connect(fb); fb.connect(echo); ef.connect(mus);
      nbuf = ac.createBuffer(1, ac.sampleRate*2, ac.sampleRate);
      const d = nbuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
    return true;
  }
  function tone(f, d, o={}){
    if (!ac) return; const t = ac.currentTime + (o.at||0), osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t); if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t+d);
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(o.vol ?? .2, t + (o.a ?? .005)); g.gain.exponentialRampToValueAtTime(.0001, t+d);
    if (o.lp){ const f2 = ac.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = o.lp; osc.connect(f2); f2.connect(g); } else osc.connect(g);
    g.connect(o.dest || sfx); if (o.echo) g.connect(echo);
    osc.start(t); osc.stop(t + d + .05);
  }
  function noise(d, o={}){
    if (!ac) return; const t = ac.currentTime + (o.at||0), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nbuf; f.type = o.type || 'bandpass'; f.frequency.setValueAtTime(o.f0 || 1000, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t+d); f.Q.value = o.q || 1;
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(o.vol ?? .2, t + (o.a ?? .005)); g.gain.exponentialRampToValueAtTime(.0001, t+d);
    s.connect(f); f.connect(g); g.connect(o.dest || sfx); s.start(t, Math.random()*1.5, d + .05);
  }
  // ----- เอฟเฟกต์เสียง -----
  const cast = () => { if (!ac) return; const p = R(.94,1.08);
    tone(520*p, .22, {to:1500*p, vol:.16}); tone(1040*p, .2, {type:'triangle', to:2400*p, vol:.07, at:.01});
    noise(.22, {f0:2500, f1:9000, q:1.2, vol:.1}); noise(.12, {type:'lowpass', f0:600, f1:200, vol:.12});
    [1760,2349,2794].forEach((f,i) => tone(f*R(.98,1.02), .25, {vol:.035, at:.03+i*.05})); };
  const hit = () => { tone(420, .12, {type:'square', to:90, vol:.07, lp:1800}); noise(.1, {f0:3000, f1:800, vol:.1}); tone(1568, .15, {vol:.05}); };
  const kill = () => { tone(170, .55, {to:34, vol:.5}); tone(90, .6, {type:'sawtooth', to:30, vol:.12, lp:300});
    noise(.6, {type:'lowpass', f0:2200, f1:150, vol:.3, a:.01}); [2093,1568,1175,784].forEach((f,i) => tone(f, .4, {type:'triangle', vol:.06, at:i*.06})); };
  const hurt = () => { tone(130, .3, {to:48, vol:.5}); tone(220, .35, {type:'sawtooth', to:80, vol:.12, lp:500}); noise(.2, {type:'lowpass', f0:900, f1:200, vol:.25}); };
  const stepS = run => { noise(.07, {f0:R(500,900)*(run?1.2:1), q:.8, vol:run?.09:.06}); tone(R(70,95), .07, {vol:run?.12:.08}); };
  const wave = n => { intensity = n;
    [[98,.2,2.2],[147,.1,1.8],[203,.07,1.4],[311,.05,1]].forEach(([f,v,d]) => tone(f, d, {vol:v, a:.01}));
    noise(.9, {f0:300, f1:3000, q:.7, vol:.12, a:.6}); };
  const clear = () => [523,659,784,1047].forEach((f,i) => tone(f, .5, {type:'triangle', vol:.1, at:i*.11}));
  const over = () => { tone(330, 1.6, {type:'sawtooth', to:70, vol:.22, lp:900}); tone(98, 2.2, {vol:.35}); tone(147, 2, {vol:.2, at:.05});
    noise(1.2, {type:'lowpass', f0:1500, f1:80, vol:.2}); music(false); };
  const spawn = () => { if (!ac || ac.currentTime - lastSpawn < .3) return; lastSpawn = ac.currentTime; tone(R(60,80), .35, {type:'sawtooth', to:45, vol:.06, lp:220, a:.05}); };
  const dash = () => { if (!ac) return; noise(.32, {f0:700, f1:2600, q:.9, vol:.22, a:.03}); noise(.25, {type:'lowpass', f0:900, f1:200, vol:.14}); tone(220, .18, {type:'triangle', to:110, vol:.06, lp:900}); };
  const land = () => { if (!ac) return; tone(95, .18, {to:50, vol:.2}); noise(.12, {type:'lowpass', f0:1200, f1:300, vol:.14}); };
  const warn = () => { if (!ac) return; tone(300, .5, {type:'sawtooth', to:620, vol:.07, lp:1400, a:.05}); tone(150, .5, {type:'square', to:300, vol:.05, lp:600}); };
  const charge = () => { if (!ac) return; noise(.4, {f0:300, f1:1800, q:.8, vol:.2, a:.02}); tone(110, .35, {type:'sawtooth', to:55, vol:.15, lp:500}); };
  const circle = () => { if (!ac) return; tone(220, .9, {to:880, vol:.08, a:.3}); tone(330, .9, {type:'triangle', to:1320, vol:.05, a:.4}); [0,.15,.3,.45,.6].forEach((t,i) => tone(1200 + i*400, .2, {vol:.03, at:t})); };
  const beamShot = () => { if (!ac) return; noise(.8, {f0:400, f1:5000, q:.6, vol:.25, a:.02}); tone(70, .9, {type:'sawtooth', to:40, vol:.3, lp:400}); tone(880, .8, {type:'triangle', to:440, vol:.1}); };
  const coin = () => { if (!ac) return; [988,1319].forEach((f,i) => tone(f, .15, {type:'square', vol:.06, at:i*.07})); };
  const ui = () => { tone(110, .8, {to:55, vol:.4}); noise(.7, {f0:400, f1:6000, q:.8, vol:.18, a:.35}); [784,1047,1568].forEach((f,i) => tone(f, .5, {type:'triangle', vol:.07, at:.15+i*.1})); };
  const thunder = big => { if (!ac) return; noise(big ? 1.1 : .45, {f0:big ? 1800 : 3500, f1:big ? 90 : 600, q:.6, vol:big ? .42 : .2, a:.004}); tone(big ? 58 : 90, big ? 1.1 : .4, {type:'sawtooth', to:30, vol:big ? .4 : .18, lp:400}); tone(big ? 2400 : 3200, .12, {type:'square', to:400, vol:.06}); };
  // ----- ดนตรีบรรยากาศ: ลมเบา ๆ + เสียงทุ้ม + คอร์ดแพด + อาร์เปจโจ + กลอง (หนักขึ้นตามเวฟ) -----
  const prog = [[110,164.8,220,261.6],[87.3,130.8,174.6,261.6],[98,146.8,196,293.7],[82.4,123.5,164.8,246.9]];
  const scale = [220,261.6,293.7,329.6,392,440,523.3];
  function startAmbient(){
    amb = ac.createGain(); amb.gain.value = 1; amb.connect(mus); const nodes = [];
    const w = ac.createBufferSource(); w.buffer = nbuf; w.loop = true; const wf = ac.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 420; wf.Q.value = .6;
    const wg = ac.createGain(); wg.gain.value = .05; const lfo = ac.createOscillator(); lfo.frequency.value = .08; const lg = ac.createGain(); lg.gain.value = .025;
    lfo.connect(lg); lg.connect(wg.gain); w.connect(wf); wf.connect(wg); wg.connect(amb); w.start(); lfo.start(); nodes.push(w, lfo);
    const dl = ac.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 220; const dg = ac.createGain(); dg.gain.value = .07; dl.connect(dg); dg.connect(amb);
    [55, 55.4].forEach(f => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(dl); o.start(); nodes.push(o); });
    amb.nodes = nodes;
  }
  function pad(f, t, d){ [['sine',0],['triangle',4]].forEach(([ty,dt]) => { const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
    o.type = ty; o.frequency.value = f; o.detune.value = dt; lp.type = 'lowpass'; lp.frequency.value = 900;
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.04, t+1.6); g.gain.exponentialRampToValueAtTime(.0001, t+d+1.5);
    o.connect(lp); lp.connect(g); g.connect(mus); o.start(t); o.stop(t+d+1.6); }); }
  function kick(t, v){ const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t+.28);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t+.32); o.connect(g); g.connect(mus); o.start(t); o.stop(t+.35); }
  function playStep(s, t){
    const ch = prog[Math.floor(s/16) % prog.length], k = s % 16, rel = t - ac.currentTime;
    if (k === 0) ch.forEach(f => pad(f, t, 4.6));
    if (k === 0 || (intensity >= 1 && k === 8) || (intensity >= 3 && k % 4 === 0)) kick(t, k === 0 ? .3 : .2);
    if (intensity >= 4 && k % 2 === 1) noise(.04, {type:'highpass', f0:7000, vol:.03, at:rel, dest:mus});
    if (k % 2 === 0 && Math.random() < .6) tone(Math.random() < .7 ? ch[(Math.random()*4)|0]*2 : scale[(Math.random()*scale.length)|0], .5, {type:'triangle', vol:.07, at:rel, dest:mus, echo:true});
  }
  function sched(){ while (nextT < ac.currentTime + .25){ playStep(step, nextT); nextT += .3; step++; } }
  function music(on){
    if (!ac) return;
    if (on && !musicOn){ musicOn = true; step = 0; nextT = ac.currentTime + .1; startAmbient(); timer = setInterval(sched, 80); }
    else if (!on && musicOn){ musicOn = false; clearInterval(timer); const a = amb; if (a){ a.gain.setTargetAtTime(0, ac.currentTime, .5); setTimeout(() => a.nodes.forEach(n => { try{ n.stop(); }catch(e){} }), 2500); } }
  }
  function toggle(){ muted = !muted; if (master) master.gain.setTargetAtTime(muted ? 0 : .8, ac.currentTime, .05); if (btn) btn.textContent = muted ? '🔇' : '🔊'; }
  if (btn) btn.addEventListener('click', () => { init(); toggle(); btn.blur(); });
  addEventListener('keydown', e => { if (e.code === 'KeyM' && !e.repeat) toggle(); });
  document.addEventListener('visibilitychange', () => { if (!ac) return; document.hidden ? ac.suspend() : ac.resume(); });
  return {init, cast, hit, kill, hurt, step:stepS, wave, clear, over, spawn, ui, dash, land, circle, beamShot, coin, warn, charge, thunder, music, toggle};
})();

<script>
/* กล่องแสดง error บนหน้าจอ (ช่วยหาสาเหตุบนมือถือ/เบราว์เซอร์ในแอป) */
(function(){
  var seen = {}, n = 0, box;
  function show(t){
    if (seen[t] || n >= 3) return; seen[t] = 1; n++;
    if (!box){ box = document.createElement('pre'); box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:38%;overflow:auto;margin:0;padding:8px 10px;background:rgba(40,0,0,.92);color:#ffb4b4;font:11px/1.35 monospace;white-space:pre-wrap;z-index:99999;user-select:text;-webkit-user-select:text'; box.onclick = function(){ box.style.display = 'none'; }; (document.body || document.documentElement).appendChild(box); }
    box.style.display = 'block'; box.textContent += t + '\n\n';
  }
  window.addEventListener('error', function(e){ if (!e.filename && !e.lineno) return; show('ERROR: ' + e.message + '\n' + (e.filename || '') + ':' + e.lineno + ':' + e.colno + (e.error && e.error.stack ? '\n' + String(e.error.stack).split('\n').slice(0,4).join('\n') : '')); });
  window.addEventListener('unhandledrejection', function(e){ show('PROMISE: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
})();

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<script>
(() => {

  const ARENA = 85;

    new THREE.MeshStandardMaterial({color:0x3b4a22, roughness:1, metalness:0}));

  const tuftGeo = new THREE.ConeGeometry(.12,.5,4), flowerGeo = new THREE.SphereGeometry(.12,6,6);
  const tuftMat = new THREE.MeshStandardMaterial({color:0x4a5a22, flatShading:true});

  for (let i=0;i<800;i++){

  // pillars for atmosphere
  // ต้นไม้
  const trunkGeo = new THREE.CylinderGeometry(.35,.5,2.4,6), leafGeo = new THREE.DodecahedronGeometry(1.6);
  const coneGeo = new THREE.ConeGeometry(1.8,3.2,7);
  const trunkMat = new THREE.MeshStandardMaterial({color:0x2e1f14, flatShading:true});
  const leafMats = [0x3a4a1e,0x4a3a1c,0x2c3a1a].map(c => new THREE.MeshStandardMaterial({color:c, flatShading:true}));
  const trees = [];
  function makeTree(x, z, s, solid){
    const g = new THREE.Group(), pine = Math.random() < .4, lm = leafMats[Math.floor(Math.random()*3)];
    const t = new THREE.Mesh(trunkGeo, trunkMat); t.position.y = 1.2; g.add(t);
    if (pine) { [3.2,4.6].forEach((y,i) => { const c = new THREE.Mesh(coneGeo, lm); c.position.y = y; c.scale.setScalar(1 - i*.35); g.add(c); }); }

    if (solid) trees.push({x, z, r:.6*s});
  }
  for (let i=0;i<75;i++){            // ต้นไม้ในสนาม
    const a = Math.random()*Math.PI*2, r = 11 + Math.random()*(ARENA-16);

  const sunDisc = new THREE.Mesh(new THREE.SphereGeometry(38,24,24), new THREE.MeshBasicMaterial({color:0xff4a1a, fog:false}));

  const cloudMat = new THREE.MeshBasicMaterial({color:0x180a09, fog:false});
  for (let i=0;i<22;i++){
    const a = Math.random()*Math.PI*2, r = 230 + Math.random()*120;
    const c = new THREE.Mesh(new THREE.SphereGeometry(1,8,6), cloudMat);
    c.position.set(Math.cos(a)*r, 80 + Math.random()*70, Math.sin(a)*r);
    c.scale.set(60+Math.random()*60, 10+Math.random()*8, 30+Math.random()*30); scene.add(c);
  }
  const EMB = 260, embPos = new Float32Array(EMB*3);
  for (let i=0;i<EMB;i++){ embPos[i*3] = (Math.random()-.5)*90; embPos[i*3+1] = Math.random()*30; embPos[i*3+2] = (Math.random()-.5)*90; }
  const embGeo = new THREE.BufferGeometry(); embGeo.setAttribute('position', new THREE.BufferAttribute(embPos, 3));
  const embers = new THREE.Points(embGeo, new THREE.PointsMaterial({color:0xff8a3a, size:.45, transparent:true, opacity:.9, fog:false}));
  embers.frustumCulled = false; scene.add(embers);
  function updateEmbers(dt){

      embPos[i*3] += dt*1.5; embPos[i*3+1] -= dt*(1.2 + (i%5)*.4); embPos[i*3+2] += Math.sin(i+performance.now()*.001)*dt;

      if (dz > 45) embPos[i*3+2] -= 90; else if (dz < -45) embPos[i*3+2] += 90;
    }
    embGeo.attributes.position.needsUpdate = true;
  }
  function pushOut(p, rad){
    for (const t of trees){
      const dx = p.x - t.x, dz = p.z - t.z, m = t.r + rad, d2 = dx*dx + dz*dz;
      if (d2 < m*m && d2 > 1e-6) { const d = Math.sqrt(d2); p.x = t.x + dx/d*m; p.z = t.z + dz/d*m; }

  }

  // ---------- Player ----------

  const M = (c, r=.85, m=0, flat=false) => new THREE.MeshStandardMaterial({color:c, roughness:r, metalness:m, flatShading:flat});
  const skin = M(0xe2a982,.7), shirt = M(0x3d6ab0), shirtD = M(0x2c4d85), pants = M(0x3b3a4a), boot = M(0x4b3220),
        belt = M(0x5a3b22,.8), hairM = M(0x2a1a12,.85,0,true), wood = M(0x7a5532,.95,0,true), woodD = M(0x4d3420,.95,0,true),
        leafM = M(0x4f9a3a,.8,0,true), bag = M(0x6b4a2b,.9), gold = M(0xd9b24a,.4,.8), dark = new THREE.MeshBasicMaterial({color:0x1a1210});
  const mk = (geo, mat, x=0, y=0, z=0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.castShadow = true; return m; };
  const sleeve = M(0x3d6ab0), glove = M(0xe2a982,.7);     // แขนเสื้อ / มือ-ท่อนแขนล่าง แยกวัสดุออกมาเพื่อให้ตัวละครแต่ละตัวเปลี่ยนสีได้
  const cyl = (rt, rb, h, seg=10) => new THREE.CylinderGeometry(rt, rb, h, seg);
  const ball = (r, w=12, h=9) => new THREE.SphereGeometry(r, w, h);
  const box = (x,y,z) => new THREE.BoxGeometry(x,y,z);
  const fm = (c,o) => new THREE.MeshBasicMaterial({color:c, transparent:true, opacity:o, blending:THREE.AdditiveBlending, depthWrite:false, fog:false, side:THREE.DoubleSide});

  // ท่อนล่าง: สะโพก + ขา (หมุนตามทิศที่เดินได้อิสระจากลำตัว)
  const lower = new THREE.Group(); lower.position.y = .98; rig.add(lower);
  lower.add(mk(cyl(.29,.28,.26), pants, 0, 0, 0));
  lower.add(mk(cyl(.295,.295,.06), belt, 0, .15, 0));
  lower.add(mk(box(.09,.065,.02), gold, 0, .15, -.295));
  function makeLeg(x){
    const hip = new THREE.Group(); hip.position.set(x,-.08,0); lower.add(hip);
    const knee = new THREE.Group(); knee.position.y = -.48; hip.add(knee);

    const hipStd = new THREE.Group(); hip.add(hipStd);
    hipStd.add(mk(ball(.155), pants));
    hipStd.add(mk(cyl(.15,.11,.46), pants, 0, -.24, 0));
    const kneeStd = new THREE.Group(); knee.add(kneeStd);
    kneeStd.add(mk(ball(.115), pants));
    kneeStd.add(mk(cyl(.108,.082,.4), pants, 0, -.2, 0));
    kneeStd.add(mk(cyl(.09,.095,.16), boot, 0, -.31, 0));
    kneeStd.add(mk(box(.21,.11,.4), boot, 0, -.355, -.09));
    // ขาใหม่ของนักวิ่งสายฟ้า: ต้นขา-น่องเรียวแบบนักกีฬา + ข้อเท้า (ankle) ขยับได้ + รองเท้าสปรินต์มีแถบสายฟ้าเรืองแสง

    const ankle = new THREE.Group(); ankle.position.y = -.38; kneeV.add(ankle);                                                    // ข้อเท้า: หมุน x ได้

    ankle.add(mk(box(.17,.075,.3), boot, 0, -.0, -.05));                                                                          // ตัวรองเท้า
    { const toe = mk(ball(.088), boot, 0, -.015, -.2); toe.scale.set(1,.7,1.15); ankle.add(toe); }                                // หัวรองเท้า
    ankle.add(mk(box(.19,.05,.44), boot, 0, -.04, -.085));                                                                        // พื้นรองเท้า
    { const gs = glow(); gs.scale.set(.2,.44,1); gs.position.set(0,-.012,-.085); gs.rotation.x = -Math.PI/2; ankle.add(gs); }      // แถบเรืองแสงขอบพื้น
    { const fin = new THREE.Mesh(new THREE.ConeGeometry(.035,.22,4), fm(0xffa03c,.9)); fin.position.set(0,.05,.19); fin.rotation.x = 1.25; ankle.add(fin); }   // ครีบสายฟ้าที่ส้น

  // ท่อนบน: เสื้อ กระเป๋าสะพาย หัว ผมม้วน แขน

  spine.add(mk(cyl(.095,.105,.1,8), skin, 0, .68, 0));

  for (const x of [-.08,.08]) head.add(mk(ball(.03,8,6), dark, x, .03, -.212));
  head.add(mk(ball(.03,8,6), skin, 0, -.03, -.235));
  head.add(mk(box(.07,.012,.01), dark, 0, -.1, -.218));

  for (const x of [-.08,.08]) head.add(mk(box(.085,.018,.015), hairM, x, .08, -.218));   // คิ้วเข้ม
  const stubble = M(0x3a2a20,.95,0,true);
  head.add(mk(new THREE.SphereGeometry(.243,14,8,-Math.PI/2-1.45,2.9,2.0,.85), stubble));  // หนวดเคราจาง ๆ
  for (const x of [-.23,.23]){ const e = mk(ball(.045,8,6), skin, x, 0, 0); e.scale.z = .7; head.add(e); }
  const hairTop = mk(new THREE.SphereGeometry(.255,14,8,0,Math.PI*2,0,.9), hairM, 0, .02, .01);
  const hairBack = mk(new THREE.SphereGeometry(.255,14,10,-Math.PI/2+.8,Math.PI*2-1.6,0,1.45), hairM, 0, .02, .01);
  head.add(hairTop, hairBack);
  function makeArm(x){

    sh.add(mk(cyl(.118,.102,.34), sleeve, 0, -.15, 0));
    const el = new THREE.Group(); el.position.y = -.34; sh.add(el);

  }
  const armL = makeArm(-.42), armR = makeArm(.42);

  // กิ่งไม้เวทมนตร์ ถือในมือขวา (แกนยาว = -y)
  const gun = new THREE.Group(); gun.position.set(0,-.34,0); armR.el.add(gun);
  const coilMat = new THREE.MeshBasicMaterial({color:0xb36bff});
  const gp = (geo, mat, x, y, z, rz=0) => { const m = mk(geo, mat, x, y, z); m.rotation.z = rz; gun.add(m); return m; };
  gp(cyl(.03,.034,.5,6), wood, 0,-.1,0);
  gp(cyl(.038,.038,.14,6), belt, 0,.0,0);                  // เทปหนังพันตรงมือจับ

      e.position.addScaledVector(TMP, d.speed*dt*(d.stn > 0 ? 0 : d.frz > 0 ? FS_CFG.slow : 1));            // ติดน้ำแข็ง = เดินช้าลง
      pushOut(e.position, .8);

      d.phase += d.stn > 0 ? 0 : dt*(4 + d.speed*1.1); animEnemy(d);                                   // ยิ่งเร็วยิ่งก้าวถี่
      }

        const f = $('flash'); f.style.opacity = 1; setTimeout(() => f.style.opacity = 0, 160);
        if (S.hp <= 0) { gameOver(); return; }
      }
    }

    for (let i=0;i<enemies.length;i++){ const a = enemies[i]; if(!a.userData.active) continue;
      for (let j=i+1;j<enemies.length;j++){ const b = enemies[j]; if(!b.userData.active) continue;

const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
const hit=p=>p.x>btn.x&&p.x<btn.x+btn.w&&p.y>btn.y&&p.y<btn.y+btn.h;
const go=()=>{window.SFX&&(SFX.init(),SFX.ui());window.__startGame&&window.__startGame();};
cv.addEventListener('pointermove',e=>{hover=hit(pos(e));cv.style.cursor=hover?'pointer':'default';});
cv.addEventListener('click',e=>{if(hit(pos(e)))go();});
addEventListener('keydown',e=>{if(root.style.display!=='none'&&(e.code==='Enter'||e.code==='Space')){e.preventDefault();go();}});
